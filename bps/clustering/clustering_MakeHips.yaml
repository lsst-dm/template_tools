# This is a prescription for quantum clustering with BPS, suitable for the
# standard HiPS generation pipeline for template curation.
#
# Use it by adding:
#
#   includeConfigs:
#     - ${TEMPLATE_TOOLS_DIR}/bps/clustering/clustering_MakeHips.yaml
#
# (with no outer indentation) to your BPS config file.
#

clusterAlgorithm: lsst.ctrl.bps.quantum_clustering_funcs.dimension_clustering
cluster:
  prettyPicture:
    pipetasks: makeSingleBandRGBCoaddU, makeSingleBandRGBCoaddG, makeSingleBandRGBCoaddR, makeSingleBandRGBCoaddI, makeSingleBandRGBCoaddZ, makeSingleBandRGBCoaddY
    dimensions: patch
  highOrderHips:
    pipetasks: makeHighOrderHipsU, makeHighOrderHipsG, makeHighOrderHipsR, makeHighOrderHipsI, makeHighOrderHipsZ, makeHighOrderHipsY
    dimensions: healpix8
  lowOrderHips:
    pipetasks: makeLowOrderHipsU, makeLowOrderHipsG, makeLowOrderHipsR, makeLowOrderHipsI, makeLowOrderHipsZ, makeLowOrderHipsY
    dimensions: healpix3
