description: |
  Default HiPS to produce during routine template curation processing.
instrument: lsst.obs.lsst.LsstCam

parameters:
  base_uri: ""
  hips_title: ""
  abs_max: 75500
  rgb_lum_floor: 0.00006

tasks:
  # u
  makeSingleBandRGBCoaddU:
    class: lsst.pipe.tasks.prettyPictureMaker.PrettyPictureTask
    config:
      file: $DRP_PIPE_DIR/config/prettyPicture.py
      connections.inputCoadds: template_coadd
      connections.outputRGB: template_coadd_u_gray
      connections.outputRGBMask: template_coadd_u_mask
      python: |
        from lsst.pipe.tasks.prettyPictureMaker import PrettyPictureTask
        ChannelRGBConfig = PrettyPictureTask.ConfigClass.channelConfig.itemtype
        config.channelConfig = {}
        config.channelConfig["u"] = ChannelRGBConfig(r=1, g=1, b=1)
  makeHighOrderHipsU:
    class: lsst.pipe.tasks.rgb2hips.HighOrderHipsTask
    config:
      connections.input_images: template_coadd_u_gray
      connections.output_hpx: template_coadd_u_hips8
      hips_base_uri: parameters.base_uri
      color_ordering: u
      file_extension: png
  makeLowOrderHipsU:
    class: lsst.pipe.tasks.rgb2hips.LowOrderHipsTask
    config:
      connections.input_hips: template_coadd_u_hips8
      hips_base_uri: parameters.base_uri
      color_ordering: u
      file_extension: png
  writeAllSkyHipsInfoU:
    class: lsst.pipe.tasks.rgb2hips.AllSkyHipsTask
    config:
      connections.input_task_label: makeLowOrderHipsU
      connections.input_hips: template_coadd_u_hips8
      hips_base_uri: parameters.base_uri
      color_ordering: u
      bluest_band: u
      file_extension: png
      python: |
        config.properties.creator_did_template = "ivo://org.rubinobs/lsst"
        config.properties.obs_title_template = "u LSSTCam " + parameters.hips_title
        config.properties.obs_description_template = "u-band template_coadd LSSTCam"
