<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alert Production Template Coverage</title>
<script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #021A18;
  color: #DCE0E3;
  padding: 16px;
}
h1 {
  text-align: center;
  margin-bottom: 8px;
  font-size: 1.6em;
  color: #00BABC;
}
.subtitle {
  text-align: center;
  color: #6A6E6E;
  margin-bottom: 16px;
  font-size: 0.9em;
}
.summary {
  text-align: center;
  margin-bottom: 12px;
  font-size: 0.9em;
  color: #DCE0E3;
}
.summary span { font-weight: 600; color: #F5F5F5; }
.band-toggle {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 12px;
}
.band-btn {
  padding: 6px 14px;
  border: 2px solid #6A6E6E;
  border-radius: 4px;
  background: transparent;
  color: #DCE0E3;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.9em;
  transition: all 0.15s;
}
.band-btn.active { color: #F5F5F5; }
.band-btn.active[data-band="u"] { border-color: #3eb7ff; background: #3eb7ff33; }
.band-btn.active[data-band="g"] { border-color: #30c39f; background: #30c39f33; }
.band-btn.active[data-band="r"] { border-color: #ff7e00; background: #ff7e0033; }
.band-btn.active[data-band="i"] { border-color: #2af5ff; background: #2af5ff33; }
.band-btn.active[data-band="z"] { border-color: #a7f9c1; background: #a7f9c133; }
.band-btn.active[data-band="y"] { border-color: #fdc900; background: #fdc90033; }
.band-btn:hover { opacity: 0.8; }
.plot-container {
  background: #062E2C;
  border-radius: 8px;
  padding: 8px;
}
</style>
</head>
<body>

<h1>Alert Production Template Coverage</h1>
<p class="subtitle">Sky positions of tracts with template coverage, by band</p>
<div class="summary" id="summary"></div>
<div class="band-toggle" id="band-toggle"></div>
<div class="plot-container">
  <div id="sky-plot" style="width:100%; height:600px;"></div>
</div>

<script>
const BAND_COLORS = {
  u: '#3eb7ff', g: '#30c39f', r: '#ff7e00',
  i: '#2af5ff', z: '#a7f9c1', y: '#fdc900'
};

let DATA;
let activeBands = new Set();

fetch('deployed_template_data.json').then(r => r.json()).then(d => { DATA = d; init(); })
  .catch(() => {
    document.getElementById('summary').textContent =
      'Could not load deployed_template_data.json. Place it alongside this HTML file.';
  });

function init() {
  const bands = ['u', 'g', 'r', 'i', 'z', 'y'].filter(b => b in DATA.summary);
  bands.forEach(b => activeBands.add(b));

  const summaryParts = bands.map(b => {
    const s = DATA.summary[b];
    return `<span style="color:${BAND_COLORS[b]}">${b}</span>: ${s.n_patches} patches / ${s.n_tracts} tracts / ${s.area_sqdeg} deg²`;
  });
  document.getElementById('summary').innerHTML = summaryParts.join(' &nbsp;|&nbsp; ');

  const toggle = document.getElementById('band-toggle');
  bands.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'band-btn active';
    btn.dataset.band = b;
    btn.textContent = b;
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      if (activeBands.has(b)) activeBands.delete(b);
      else activeBands.add(b);
      plot();
    });
    toggle.appendChild(btn);
  });

  plot();
}

function plot() {
  const traces = [];
  for (const band of activeBands) {
    const recs = DATA.records.filter(r => r.band === band);
    if (recs.length === 0) continue;
    const ra = [];
    const dec = [];
    const text = [];
    for (const r of recs) {
      let ras = r.corners.map(pt => pt.ra);
      const maxRa = Math.max(...ras);
      const minRa = Math.min(...ras);
      if (maxRa - minRa > 180) {
        ras = ras.map(v => v < 180 ? v + 360 : v);
      }
      for (let i = 0; i < r.corners.length; i++) {
        ra.push(ras[i]); dec.push(r.corners[i].dec); text.push(`Tract ${r.tract}`);
      }
      ra.push(ras[0]); dec.push(r.corners[0].dec); text.push(`Tract ${r.tract}`);
      ra.push(null); dec.push(null); text.push('');
    }
    traces.push({
      x: ra,
      y: dec,
      mode: 'lines',
      type: 'scatter',
      name: `${band} (${recs.length} tracts)`,
      line: { color: BAND_COLORS[band], width: 1.5 },
      fill: 'toself',
      fillcolor: BAND_COLORS[band] + '33',
      text: text,
      hoverinfo: 'text',
    });
  }

  const layout = {
    xaxis: {
      title: 'RA (deg)', autorange: 'reversed',
      color: '#DCE0E3', gridcolor: '#0C4A47',
    },
    yaxis: {
      title: 'Dec (deg)',
      color: '#DCE0E3', gridcolor: '#0C4A47',
      scaleanchor: 'x', scaleratio: 1,
    },
    paper_bgcolor: '#062E2C',
    plot_bgcolor: '#021A18',
    font: { color: '#DCE0E3' },
    legend: { x: 1, y: 1, bgcolor: 'rgba(6,46,44,0.8)' },
    margin: { t: 20, b: 50, l: 60, r: 20 },
  };

  Plotly.react('sky-plot', traces, layout, { responsive: true });
}
</script>
</body>
</html>
