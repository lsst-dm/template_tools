<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
<title>Alert Production Template Coverage</title>
<script type="text/javascript" src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #021A18;
  color: #DCE0E3;
  padding: 16px;
}
h1 {
  text-align: center;
  margin-bottom: 8px;
  font-size: 1.6em;
  color: #00BABC;
}
.subtitle {
  text-align: center;
  color: #6A6E6E;
  margin-bottom: 16px;
  font-size: 0.9em;
}
.summary {
  text-align: center;
  margin-bottom: 12px;
  font-size: 0.9em;
  color: #DCE0E3;
}
.summary span { font-weight: 600; color: #F5F5F5; }
.band-toggle {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 12px;
}
.band-btn {
  padding: 6px 14px;
  border: 2px solid #6A6E6E;
  border-radius: 4px;
  background: transparent;
  color: #DCE0E3;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.9em;
  transition: all 0.15s;
}
.band-btn.active { color: #F5F5F5; }
.band-btn.active[data-band="u"] { border-color: #3eb7ff; background: #3eb7ff33; }
.band-btn.active[data-band="g"] { border-color: #30c39f; background: #30c39f33; }
.band-btn.active[data-band="r"] { border-color: #ff7e00; background: #ff7e0033; }
.band-btn.active[data-band="i"] { border-color: #2af5ff; background: #2af5ff33; }
.band-btn.active[data-band="z"] { border-color: #a7f9c1; background: #a7f9c133; }
.band-btn.active[data-band="y"] { border-color: #fdc900; background: #fdc90033; }
.band-btn:hover { opacity: 0.8; }
.toggle-hint {
  text-align: center;
  color: #6A6E6E;
  font-size: 0.75em;
  margin-bottom: 12px;
}
.plot-container {
  background: #062E2C;
  border-radius: 8px;
  padding: 8px;
}
.generated-at {
  text-align: right;
  color: #6A6E6E;
  font-size: 0.75em;
  margin-top: 8px;
}
</style>
</head>
<body>

<h1>Alert Production Template Coverage</h1>
<p class="subtitle">Sky positions of tracts with template coverage, by band</p>
<div class="summary" id="summary"></div>
<div class="band-toggle" id="band-toggle"></div>
<p class="toggle-hint">Click to toggle bands</p>
<div class="plot-container">
  <div id="aladin-lite-div" style="width:100%; height:700px;"></div>
</div>
<p class="generated-at" id="generated-at"></p>

<script>
const BAND_COLORS = {
  u: '#3eb7ff', g: '#30c39f', r: '#ff7e00',
  i: '#2af5ff', z: '#a7f9c1', y: '#fdc900'
};

let DATA;
let aladin;
let activeBands = new Set();
let overlays = {};

A.init.then(() => {
  aladin = A.aladin('#aladin-lite-div', {
    fov: 180,
    projection: 'AIT',
    cooFrame: 'equatorial',
    showCooGridControl: true,
    showSimbadPointerControl: false,
    showCooGrid: true,
    survey: 'P/DSS2/color',
  });

  fetch('deployed_template_data.json')
    .then(r => r.json())
    .then(d => { DATA = d; init(); })
    .catch(e => {
      document.getElementById('summary').textContent =
        'Could not load deployed_template_data.json. Place it alongside this HTML file. Error: ' + e;
    });
});

function init() {
  const bands = ['u', 'g', 'r', 'i', 'z', 'y'].filter(b => b in DATA.summary);
  bands.forEach(b => activeBands.add(b));

  const summaryParts = bands.map(b => {
    const s = DATA.summary[b];
    return `<span style="color:${BAND_COLORS[b]}">${b}</span>: ${s.n_patches} patches / ${s.n_tracts} tracts / ${s.area_sqdeg} deg²`;
  });
  document.getElementById('summary').innerHTML = summaryParts.join(' &nbsp;|&nbsp; ');

  if (DATA.generated_at) {
    document.getElementById('generated-at').textContent = 'Data generated: ' + DATA.generated_at;
  }

  const toggle = document.getElementById('band-toggle');
  bands.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'band-btn active';
    btn.dataset.band = b;
    btn.textContent = b;
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      if (activeBands.has(b)) activeBands.delete(b);
      else activeBands.add(b);
      drawOverlays();
    });
    toggle.appendChild(btn);
  });

  drawOverlays();
}

function drawOverlays() {
  for (const band of Object.keys(overlays)) {
    aladin.removeOverlay(overlays[band]);
  }
  overlays = {};

  for (const band of activeBands) {
    const recs = DATA.records.filter(r => r.band === band);
    if (recs.length === 0) continue;

    const overlay = A.graphicOverlay({
      color: BAND_COLORS[band],
      lineWidth: 2,
    });
    aladin.addOverlay(overlay);

    for (const r of recs) {
      const coords = r.corners.map(pt => [pt.ra, pt.dec]);
      overlay.add(A.polygon(coords));
    }

    overlays[band] = overlay;
  }
}
</script>
</body>
</html>
